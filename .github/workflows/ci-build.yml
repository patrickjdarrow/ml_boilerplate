name: Build

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - pyproject.toml
      - uv.lock
  pull_request:
    branches: [master]
    paths:
      - Dockerfile
      - pyproject.toml
      - uv.lock

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # required to push cache layers to GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Buildx is required for the registry cache backend.
        # The default docker driver does not support external cache exporters.

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false  # template repo — no image to publish
          tags: ml_boilerplate:ci
          # Pull cache from GHCR. mode=max caches every intermediate layer,
          # not just the final one. Critical for the large PyTorch base image:
          # cold first run ~20 min, warm subsequent runs ~5 min.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/cache:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/cache:buildcache,mode=max